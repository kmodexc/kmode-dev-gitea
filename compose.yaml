services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  gitea:
    image: ${GITEA_IMAGE:-docker.gitea.com/gitea:28.1.0-rootless}
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-keycloak.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}

      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__PROTOCOL: http
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-22}
      GITEA__server__START_SSH_SERVER: true
      GITEA__server__LANDING_PAGE: login

      # Keycloak users are created automatically on their first login.
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: true
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__OPENID_CONNECT_SCOPES: email profile
      GITEA__oauth2_client__UPDATE_AVATAR: true

      GITEA__service__DISABLE_REGISTRATION: true
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM: ${GITEA_ENABLE_PASSWORD_SIGNIN_FORM:-false}
      GITEA__service__ENABLE_BASIC_AUTHENTICATION: ${GITEA_ENABLE_BASIC_AUTHENTICATION:-false}

      # These variables are consumed by the startup wrapper to create the
      # Gitea authentication source. They are not Gitea app.ini settings.
      KEYCLOAK_AUTO_CONFIGURE: ${KEYCLOAK_AUTO_CONFIGURE:-true}
      KEYCLOAK_DISCOVERY_URL: ${KEYCLOAK_DISCOVERY_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_GROUP_CLAIM_NAME: ${KEYCLOAK_GROUP_CLAIM_NAME:-}
      KEYCLOAK_REQUIRED_ROLE: ${KEYCLOAK_REQUIRED_ROLE:-}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-}
      KEYCLOAK_RESTRICTED_ROLE: ${KEYCLOAK_RESTRICTED_ROLE:-}
      KEYCLOAK_GROUP_TEAM_MAP: ${KEYCLOAK_GROUP_TEAM_MAP:-}
      KEYCLOAK_GROUP_TEAM_MAP_REMOVAL: ${KEYCLOAK_GROUP_TEAM_MAP_REMOVAL:-false}
    ports:
      # Apache terminates TLS and proxies to this HTTP listener.
      - "${GITEA_HTTP_BIND_ADDRESS:-127.0.0.1}:${GITEA_HTTP_BIND_PORT:-3000}:3000"
      # Gitea's embedded SSH server listens on port 22 inside the container.
      # GITEA_SSH_BIND_PORT controls the host-side published port.
      - "${GITEA_SSH_BIND_ADDRESS:-0.0.0.0}:${GITEA_SSH_BIND_PORT:-22}:22"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - ./entrypoint-keycloak.sh:/usr/local/bin/entrypoint-keycloak.sh:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gitea-data:
  gitea-config:
  postgres-data:
